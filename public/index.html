<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lynx Path · Multi-trace workspace</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/tabs.css"><script defer src="/scheduler.js"></script><script defer src="/app.js"></script><script defer src="/tabs.js"></script></head><body><header><div class="brand"><img class="brand-logo" src="/logo.png" alt="Lynx AI — AI Network Infrastructure Engineer"><b>PATH</b></div><span class="pill">LOCAL NETWORK DIAGNOSTICS</span></header>
<section class="workspace-toolbar" aria-label="Traceroute tabs"><div class="workspace-heading"><div><h1>Every connection. Its own workspace.</h1><p>Run up to 8 independent traces. Switching tabs keeps their runs active.</p></div><button id="addTrace" type="button">＋ Add traceroute</button></div><div id="traceTabs" role="tablist" aria-label="Traceroute workspaces"></div><div class="tab-tools"><label>Tab name <input id="tabName" maxlength="40" autocomplete="off" aria-label="Rename selected traceroute tab"></label><span id="tabCount" role="status"></span><button id="closeTrace" type="button">Close tab & stop its runs</button></div></section>
<div id="workspaces"></div><template id="traceTemplate"><link rel="stylesheet" href="/style.css"><main><div class="intro"><div><p class="eyebrow">FOLLOW THE PACKET</p><h1>Trace this connection.</h1><p>Trace a route. Measure its performance. See where replies stop.</p></div><span id="status" role="status">Ready</span></div>
<form id="form"><div class="fields"><label>Source IP or subnet<input id="source" list="interfaces" placeholder="Automatic routing" autocomplete="off"><datalist id="interfaces"></datalist><small id="sourceNote">Select one local interface, or leave blank.</small></label><label>Destination IP or subnet<input id="destination" value="1.1.1.1" placeholder="10.20.0.0/24" required><small>IPv4 address or CIDR.</small></label><label>Host inside destination subnet<input id="targetHost" placeholder="e.g. 10.20.0.10"><small>Required when destination is a subnet.</small></label><label class="short">Ping samples<input id="count" type="number" min="2" max="120" value="20"></label><label class="short">Max hops<input id="maxHops" type="number" min="1" max="64" value="30"></label></div><section class="run-controls"><label>Run mode<select id="runMode"><option value="once">Run once</option><option value="continuous">Continuous loop ∞</option><option value="scheduled">Scheduled repeat</option></select></label><label>Repeat delay (seconds)<input id="repeatDelay" type="number" min="1" max="86400" value="60"><small>Wait after each finished run; no overlapping probes.</small></label><label>First run at (optional)<input id="startAt" type="datetime-local"><small id="scheduleZone"></small></label></section><p class="hint">Continuous loops repeat until Stop. Scheduled repeats use the start time and delay above. Keep this page open and the computer awake; closing or reloading cancels the schedule.</p><div id="loopStatus" role="status" class="loop-status">No loop active</div><div class="actions"><button id="start">Start measurements <span>↗</span></button><button id="stop" type="button" disabled>Stop</button><button id="export" type="button" disabled>Export JSON</button><span id="platform"></span></div></form>
<div id="warnings" role="alert"></div>
<section class="metrics"><article><small>Latest ping RTT</small><strong id="last">—</strong><span>Round-trip time</span></article><article><small>Average latency / RTT</small><strong id="average">—</strong><span id="range">No replies yet</span></article><article><small>RTT jitter</small><strong id="jitter">—</strong><span>Mean adjacent RTT variation</span></article><article><small>Packet loss</small><strong id="loss">—</strong><span id="counts">0 probes completed</span></article></section>
<section class="panel"><div class="panelhead"><h2>Observed route</h2><span id="routeInfo">Awaiting trace</span></div><p class="hint">Each node is a TTL hop. Lines show probe order, not verified physical links. Multiple addresses at one TTL may indicate multiple paths.</p><div id="graph" class="graph"><div class="empty">Enter a destination to discover its path.</div></div></section>
<div class="two"><section class="panel"><div class="panelhead"><h2>Destination RTT</h2><span>milliseconds · per probe</span></div><svg id="chart" viewBox="0 0 700 210" role="img" aria-label="Destination round-trip times"></svg><p class="hint">Gaps / red marks indicate unanswered probes. Values reported as &lt;1 ms are plotted at their 1 ms upper bound.</p></section><section class="panel"><div class="panelhead"><h2>Measurement context</h2></div><dl><dt>Probe origin</dt><dd id="origin">This computer</dd><dt>Destination host</dt><dd id="endpoint">—</dd><dt>Trace protocol</dt><dd id="protocol">—</dd></dl><p class="hint">Latency here means RTT, not one-way delay. Jitter uses consecutive successful probes only. Routers may filter or rate-limit replies; a silent hop is not proof of forwarding loss.</p></section></div>
<section class="panel"><div class="panelhead"><h2>Hop details</h2><span>RTT is from source to each responding hop and back</span></div><div class="tablewrap"><table><thead><tr><th>TTL</th><th>Router address(es)</th><th>Probe RTTs</th><th>Average RTT</th><th>Observation</th></tr></thead><tbody id="hops"><tr><td colspan="5">No measurements yet.</td></tr></tbody></table></div></section>
<section class="panel"><div class="panelhead"><h2>Run history</h2><span>Latest 100 cycles · current session</span></div><div class="tablewrap"><table><thead><tr><th>Cycle</th><th>Finished</th><th>Average RTT</th><th>Jitter</th><th>Loss</th></tr></thead><tbody id="runHistory"></tbody></table></div></section><details class="panel"><summary>Raw traceroute output</summary><pre id="raw"></pre></details><footer>Lynx Path · IPv4 diagnostics · No cloud services or external frontend dependencies</footer></main></template></body></html>
